name: Insight Health
description: >-
  Insight Health builds AI clinical agents that handle the patient-facing workflows clinical staff
  spend the most time on: phone answering, fax processing, ambient note-taking, intake, follow-up,
  referral management, and triage. Built by practicing physicians, the platform is HIPAA compliant and
  SOC 2 Type II certified, and integrates with the major outpatient EHRs via FHIR R4 and HL7v2. Its
  voice agent Lumi handled the first known autonomous clinical AI conversation with a patient in
  October 2023, and the company has since handled more than 4 million patient conversations across
  60+ medical specialties. Products include Aura AI Scribe, the Aura Anywhere embedded scribe SDK for
  EHR vendors, AI FrontDesk, AI Fax Agent, Pre-Visit Intake, Follow-up, Referral Management, and Phone
  Triage agents.
